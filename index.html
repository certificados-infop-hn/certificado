<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Verificación de Certificado</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, Helvetica, sans-serif;
}

body{
    background:#eef1f7;
}

.top{
    height:180px;
    background:#1f4e96;
}

.top2{
    height:180px;
    background:#1f4e96;
    margin-top:200px;
}
.card{
    width:min(92%, 500px);
    margin:-380px auto 30px;
    background:#fff;
    border-radius:8px;
    box-shadow:0 5px 15px rgba(0,0,0,.15);
    padding:15px 25px;
}


.header{
    text-align:center;
    margin-bottom:30px;
}

.header h1{
    color:#2458a8;
    font-size:20px;
    font-weight:500;
    margin:20px 0;
}

    .centro{
    text-align:center;
}


.centro img{
    width:100%;
    max-width:280px;
    height:auto;
}


.success{
    background:#42b649;
    color:white;
    padding:12px 18px;
    border-radius:8px;
    font-size:15px;
    margin-bottom:20px;

 display:flex;
    align-items:center;
    gap:15px;

    font-size:13px;
    font-weight:bold;
}

.check{
    width:22px;
    height:22px;
    background:#fff;
    color:#42b649;

    border-radius:50%;

    display:flex;
    align-items:center;
    justify-content:center;

    font-size:14px;
    font-weight:bold;

    flex-shrink:0;
}

.item{
    margin-bottom:10px;
}

.label{
    display:inline-block;
    background:#c99632;
    color:white;
    padding:5px 14px;
    border-radius:20px;
    font-size:14px;
}

.value{
    font-size:14px;
    color:#555;
    margin-top:6px;
    border-bottom:1px solid #ddd;
    padding-bottom:6px;
}
@media (max-width:768px){

.card{
    width:100%;
    max-width:none;
    margin:-400px auto 20px;
    padding:18px;
    border-radius:8px;
}
}.top,
.top2{
    height:150px;
}

.top2{
    margin-top:170px;
}

.header h1{
    font-size:22px;
}

.success{
    font-size:14px;
    gap:10px;
    padding:12px;
}

.check{
    width:20px;
    height:20px;
    font-size:12px;
}

.label{
    font-size:14px;
    padding:5px 12px;
}

.value{
    font-size:15px;
    word-break:break-word;
}
}
@media (max-width:480px){

.card{
    width:96%;
    margin:-430px auto 15px;
    padding:15px;
}

.header h1{
    font-size:20px;
}

.centro img{
    max-width:220px;
}

.success{
    font-size:13px;
    gap:8px;
}

.label{
    font-size:13px;
}

.value{
    font-size:14px;
}
}

</style>

</head>
<body>

<div class="top"></div>
<div class="top2"></div>


<div class="card">

<div class="header">


<div class="header">

<div class="centro">
    <img src="https://github.com/cstc299-debug/mi-pagina-web/blob/main/M.png?raw=true" alt="Logo">
</div>


</div>


<h1>AUTÉNTICAR CERTIFICADO</h1>
</div>

<div class="success">
    <span class="check">✓</span>
 <span>CERTIFICADO AUTENTICADO CON LOS SIGUIENTES DATOS.</span>
</div>

<div class="item">
<div class="label">Estudiante:</div>
<div class="value">DANIEL ALEJANDRO CABALLERO PALACIOS  </div>
</div>

<div class="item">
<div class="label">Curso:</div>
<div class="value">EXCEL AVANZADO</div>
</div>

<div class="item">
<div class="label">Unidad Operativa:</div>
<div class="value">Departamento de Formación a Distancia</div>
</div>

<div class="item">
<div class="label">Modo de formación:</div>
<div class="value">Complementación a Distancia (Virtual)</div>
</div>

<div class="item">
<div class="label">Número de registro:</div>
<div class="value">4636339</div>
</div>

</div>

</body>
</html>


<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Mantenimiento</title>

<style>
body {
    font-family: Arial, sans-serif;
    text-align: center;
    background: transparent;
    color: inherit;
    margin: 0;
    padding: 20px;
}

h2 {
    font-size: 22px;
    font-weight: normal;
}

.contador {
    display: flex;
    justify-content: center;
    gap: 15px;
    flex-wrap: wrap;
    margin-top: 20px;
}

.tiempo span {
    display: block;
    font-size: 30px;
    font-weight: bold;
}

.tiempo small {
    font-size: 12px;
}
</style>
</head>

<body>

<h2>Sitio web temporalmente en mantenimiento</h2>

<div class="contador">
    <div class="tiempo">
        <span id="dias">000</span>
        <small>DÍAS</small>
    </div>

    <div class="tiempo">
        <span id="horas">000</span>
        <small>HORAS</small>
    </div>

    <div class="tiempo">
        <span id="minutos">000</span>
        <small>MINUTOS</small>
    </div>

    <div class="tiempo">
        <span id="segundos">000</span>
        <small>SEGUNDOS</small>
    </div>
</div>

<script>

// ======================================
// CONFIGURA AQUÍ TU FECHA DE FINALIZACIÓN
// Formato: AÑO-MES-DÍA T HORA:MINUTOS:SEGUNDOS
// Zona horaria de Honduras: -06:00
// ======================================

const fechaRegreso = new Date(
    "2026-11-20T19:20:00-06:00"
).getTime();

// ======================================
// NO NECESITAS MODIFICAR LO SIGUIENTE
// ======================================

function actualizarContador() {

    const diferencia = fechaRegreso - Date.now();

    if (diferencia <= 0) {

        document.getElementById("dias").textContent = "000";
        document.getElementById("horas").textContent = "000";
        document.getElementById("minutos").textContent = "000";
        document.getElementById("segundos").textContent = "000";

        clearInterval(temporizador);
        return;
    }

    const dias = Math.floor(diferencia / 86400000);
    const horas = Math.floor(diferencia / 3600000) % 24;
    const minutos = Math.floor(diferencia / 60000) % 60;
    const segundos = Math.floor(diferencia / 1000) % 60;

    document.getElementById("dias").textContent =
        String(dias).padStart(3, "0");

    document.getElementById("horas").textContent =
        String(horas).padStart(3, "0");

    document.getElementById("minutos").textContent =
        String(minutos).padStart(3, "0");

    document.getElementById("segundos").textContent =
        String(segundos).padStart(3, "0");
}

actualizarContador();

const temporizador = setInterval(actualizarContador, 1000);

</script>

</body>
</html>

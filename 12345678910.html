<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>No se puede acceder a este sitio web</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: #ffffff;
            color: #202124;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 25px;
        }

        .error {
            width: 100%;
            max-width: 660px;
        }

        .icon {
            font-size: 45px;
            margin-bottom: 45px;
            color: #5f6368;
        }

        h1 {
            font-size: 25px;
            font-weight: 500;
            margin-bottom: 22px;
        }

        p {
            font-size: 16px;
            line-height: 1.6;
            color: #5f6368;
            margin-bottom: 18px;
        }

        .codigo {
            font-size: 13px;
            margin-top: 25px;
        }

        .boton {
            display: inline-block;
            margin-top: 42px;
            padding: 11px 20px;
            background: #1a73e8;
            color: white;
            border: none;
            border-radius: 25px;
            font-size: 14px;
            cursor: pointer;
        }

        .boton:hover {
            background: #1765cc;
        }

        @media (max-width: 600px) {
            .error {
                max-width: 100%;
            }

            h1 {
                font-size: 23px;
            }

            p {
                font-size: 15px;
            }
        }
    </style>
</head>

<body>

    <main class="error">

        <div class="icon">☹</div>

        <h1>No se puede acceder a este sitio web</h1>

        <p>
            Es posible que la página web no esté disponible
            temporalmente o que se haya trasladado
            permanentemente a otra dirección.
        </p>

        <p>
            Comprueba la dirección web e inténtalo de nuevo.
        </p>

        <p class="codigo">
             ERROR 404
        </p>

        <button class="boton" onclick="location.reload()">
            Volver a cargar
        </button>

    </main>

</body>
</html>
